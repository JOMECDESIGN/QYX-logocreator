     fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round">
  <path d="M50 22 A28 28 0 1 1 24 64"/>
  <circle cx="50" cy="50" r="3.5" fill="currentColor" stroke="none"/>
</svg>
